name: build_sysutils_radxa_arm64_debian

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "dev-release"
      - "release"
      - "openhd-3.0"

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_type: rock5b
            release: bullseye
          - image_type: rock5b
            release: bookworm
    env:
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
      API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build ARM64 package with native host tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ curl xz-utils file
          mkdir -p build/toolchain
          curl --fail --location --retry 3 \
            https://toolchains.bootlin.com/downloads/releases/toolchains/aarch64/tarballs/aarch64--glibc--bleeding-edge-2020.08-1.tar.bz2 \
            | tar -xj --strip-components=1 -C build/toolchain
          compiler="$GITHUB_WORKSPACE/build/toolchain/bin/aarch64-buildroot-linux-gnu-g++"
          cmake -S . -B build/package -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_CXX_COMPILER="$compiler" -DCPACK_DEBIAN_PACKAGE_ARCHITECTURE=arm64
          # Keep Debian version ordering above the timestamped packages already published.
          export OPENHD_BUILD_NUMBER="$(date -u +%Y%m%d%H%M%S)"
          cmake --build build/package --parallel 4
          (cd build/package && cpack -G DEB)
          build/toolchain/bin/aarch64-buildroot-linux-gnu-readelf -h build/package/openhd_sys_utils | grep 'Machine:.*AArch64'
          grep -aFq rockchip_native build/package/openhd_sys_utils
          cp build/package/*.deb .
          for package in ./*.deb; do
            test "$(dpkg-deb -f "$package" Architecture)" = arm64
            dpkg-deb -f "$package" Package Version Architecture Depends
          done

      - name: Upload to Github
        uses: "actions/upload-artifact@v7"
        with:
          name: "OpenHD-SysUtils-${{ matrix.release }}-arm64"
          path: |
            *.deb

      - name: Push
        if: github.ref_name == 'release' || github.ref_name == 'dev-release' || github.ref_name == 'main'
        uses: cloudsmith-io/action@master
        with:
          api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
          command: "push"
          format: "deb"
          owner: "openhd"
          repo: dev-release
          distro: "debian"
          release: "${{ matrix.release }}"
          republish: "true"
          file: "*.deb"
